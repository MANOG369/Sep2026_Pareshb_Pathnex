apiVersion: apps/v1
kind: Deployment
metadata:
  name: day16-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: day16-app
  template:
    metadata:
      labels:
        app: day16-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: day16-service
spec:
  selector:
    app: day16-app
  ports:
    - port: 80
      targetPort: 80
